                - text: "Diffusion Models & Flow Matching"
                  href: docs/notes/DL/5.qmd
                - text: "Sequence Modeling"
                  href: docs/notes/DL/6.qmd

format:
  html:
    respect-user-color-scheme: true
    toc: true
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    css: styles.css
    include-after-body: js.html
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px

filters:
  - filters/tools-tabset.lua
  - filters/color-box.lua
  - at: post-quarto
    path: filters/include-dark.lua

version: '1.9'
prerelease-subdomain: ''

freeze: false

profile:
  group:
    - [prerelease, rc]
